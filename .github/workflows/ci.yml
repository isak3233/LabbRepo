name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: 
jobs:
  build-and-test:
    name: Bygg och testa
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: restore
      - name: Build 
        run: build --no-restore --configuration Release
      - name: Test
        run : test --no-build --configuration Release 



        
          
      
    
